name: Deploy to GitHub Pages

# Changes that only touch archive/ do not build or deploy.
# The archived sites still ship with every deploy (nykolas.me/v1, /v2).
on:
  push:
    branches: [main]
    paths-ignore: ['archive/**']
  pull_request:
    paths-ignore: ['archive/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            archive/v2/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:archive
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
