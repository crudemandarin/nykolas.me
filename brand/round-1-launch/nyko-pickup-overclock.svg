<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32" width="32" height="32"><title>NYKO pickup: overclock</title>
<!--
  Flight Mode pickup canister (overclock), seen end-on. Origin (0,0) = centre; drawn ~28px on screen.
  Generated by brand/round-1-launch/gen_flight.py. Groups, back to front: lugs, hull, collar,
  lens (the only #FFB300 element), symbol. Brief: docs/claude/handoffs/FLIGHT-PICKUPS-ICON-HANDOFF.md.
  Halo + label stay in code. Fits inside r 15.
-->
<defs><linearGradient id="pk-overclock-hull" x1="-8" y1="-11" x2="8" y2="11" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9CFDE"/><stop offset="0.55" stop-color="#9AA4BE"/><stop offset="1" stop-color="#525C7A"/></linearGradient></defs>
<g id="lugs" fill="#1E2233"><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(45)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(135)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(225)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(315)"/></g>
<g id="hull"><circle r="11" fill="url(#pk-overclock-hull)" stroke="#1E2233" stroke-width="1.2"/></g>
<g id="collar"><circle r="8.2" fill="#1E2233"/></g>
<g id="lens"><circle r="6.7" fill="#FFB300"/></g>
<g id="symbol"><path d="M 1.3,-4.8 L -3,0.8 L -0.2,0.8 L -1.3,4.8 L 3,-0.8 L 0.2,-0.8 Z" fill="#1E2233"/></g>
</svg>
