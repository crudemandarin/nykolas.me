<g id="lugs" fill="#1E2233"><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(45)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(135)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(225)"/><rect x="9.2" y="-2" width="5.6" height="4" rx="1" transform="rotate(315)"/></g>
