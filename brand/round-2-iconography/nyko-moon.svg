<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 32 32" width="128" height="128"><title>NYKO Moon</title>
<!--
  NYKO Moon (hero sky). Origin (0,0) = centre; disc radius 15. Near side, north up, simplified maria.
  Unlit: the site shades the phase from the sun's direction. Source: brand/round-2-iconography/gen_earth.mjs.
-->
<defs>
  <linearGradient id="moon-face" x1="-11" y1="-11" x2="11" y2="11" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#DDE2EC"/><stop offset="1" stop-color="#C9CFDE"/>
  </linearGradient>
</defs>
<circle r="15" fill="url(#moon-face)"/>
<g id="maria" fill="#9AA4BE"><ellipse cx="-8.4" cy="0.6" rx="3.2" ry="6.4" transform="rotate(8 -8.4 0.6)"/><ellipse cx="-5.6" cy="-4.6" rx="4.4" ry="3.8"/><ellipse cx="-6.2" cy="3.4" rx="3" ry="3.4" transform="rotate(-10 -6.2 3.4)"/><ellipse cx="1.6" cy="-4.8" rx="2.7" ry="2.5"/><ellipse cx="4" cy="-1.2" rx="3.4" ry="2.6" transform="rotate(-20 4 -1.2)"/><ellipse cx="10.4" cy="-3.4" rx="1.9" ry="1.6"/><ellipse cx="7.4" cy="2" rx="1.9" ry="2.8" transform="rotate(10 7.4 2)"/><ellipse cx="-2.4" cy="6.2" rx="2.8" ry="1.9"/></g>
</svg>
